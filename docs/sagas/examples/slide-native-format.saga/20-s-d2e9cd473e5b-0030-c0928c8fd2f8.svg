<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Review stays on the slide while evidence opens beside it</title>
  <desc id="desc">A thumbnail rail selects one active slide, an item opens linked code in a side drawer, and tests preserve legacy reports and deep links.</desc>
  <defs><linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172a"/><stop offset="1" stop-color="#15243b"/></linearGradient><filter id="sh6"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#7ea6ff"/></marker><style>.ey{font:600 16px system-ui;letter-spacing:3px;fill:#66e3c4}.t{font:700 42px system-ui;fill:#f8fbff}.h{font:700 19px system-ui;fill:#f8fbff}.b{font:500 16px system-ui;fill:#afbdd2}.tiny{font:700 12px system-ui;letter-spacing:1px;fill:#7790b3}.dark{font:650 17px system-ui;fill:#17243a}.edge{stroke:#7ea6ff;stroke-width:4;fill:none;marker-end:url(#a6)}</style></defs>
  <rect width="1280" height="720" fill="url(#bg6)"/><text x="72" y="67" class="ey">THE REVIEWER LOOP</text><text x="72" y="119" class="t">Context remains visible while evidence comes to you</text>
  <g filter="url(#sh6)"><rect x="68" y="176" width="1144" height="386" rx="24" fill="#101f35" stroke="#3e5576" stroke-width="3"/>
    <g id="thumbnail-rail"><rect x="90" y="199" width="176" height="340" rx="15" fill="#0b1729"/><text x="110" y="228" class="tiny">SLIDE RAIL</text><rect x="110" y="249" width="136" height="77" rx="8" fill="#dce8ff" stroke="#7ea6ff" stroke-width="3"/><rect x="110" y="341" width="136" height="77" rx="8" fill="#253a58"/><rect x="110" y="433" width="136" height="77" rx="8" fill="#253a58"/></g>
    <g id="active-slide"><rect x="291" y="199" width="548" height="340" rx="15" fill="#f4f8ff"/><text x="321" y="230" font-family="system-ui" font-size="15" font-weight="700" fill="#637594">IMPLEMENTATION · 2 OF 4</text><circle cx="455" cy="367" r="75" fill="#66e3c4"/><rect x="585" y="300" width="196" height="51" rx="12" fill="#dce8ff"/><rect x="585" y="373" width="196" height="51" rx="12" fill="#ffdc92"/><path d="M530 367h43" class="edge"/><text x="321" y="494" font-family="system-ui" font-size="18" font-weight="600" fill="#24344f">Select a meaningful item—not a detached file.</text></g>
    <g id="code-drawer"><rect x="858" y="199" width="331" height="340" rx="15" fill="#172841" stroke="#66e3c4" stroke-width="3"/><text x="884" y="230" class="tiny">LINKED CODE</text><text x="884" y="264" class="h">internal/saga/slides.go</text><g transform="translate(884 289)"><rect width="279" height="30" fill="#16382f"/><rect y="37" width="279" height="30" fill="#3a1e2b"/><rect y="74" width="279" height="30" fill="#16382f"/><rect y="111" width="279" height="30" fill="#16382f"/><rect y="148" width="279" height="30" fill="#263a57"/><text x="12" y="21" class="b" fill="#7ff0c7">+ loadDecks(...)</text><text x="12" y="58" class="b" fill="#ff9bac">− old path</text><text x="12" y="95" class="b" fill="#7ff0c7">+ validateItem(...)</text><text x="12" y="132" class="b" fill="#7ff0c7">+ projectDecks(...)</text></g></g>
  </g>
  <path d="M533 367h45" class="edge"/>
  <g id="compatibility-proof"><rect x="68" y="591" width="430" height="73" rx="16" fill="#183149" stroke="#66e3c4" stroke-width="2"/><circle cx="101" cy="627" r="15" fill="#66e3c4"/><path d="M94 627l5 6 11-14" stroke="#0b1a2b" stroke-width="4" fill="none"/><text x="129" y="622" class="h">Contract + server tests</text><text x="129" y="647" class="b">V4 UI, deep links, legacy readers</text></g>
  <g id="context-callout"><rect x="523" y="591" width="689" height="73" rx="16" fill="#ffce73"/><text x="550" y="622" class="dark">RESULT · Evidence slides out; the active argument stays put.</text><text x="550" y="648" class="dark" font-weight="500">The reviewer can inspect implementation without losing narrative position.</text></g>
</svg>
