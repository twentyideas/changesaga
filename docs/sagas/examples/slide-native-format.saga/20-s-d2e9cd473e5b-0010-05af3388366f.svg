<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Flat records make parallel changes merge cleanly</title>
  <desc id="desc">Semantic targets are hashed into compact category-prefixed records; independent review records avoid shared mutable files and fit conservative path limits.</desc>
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071729"/><stop offset="1" stop-color="#102941"/></linearGradient><filter id="sh4"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-opacity=".28"/></filter><marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#7ea6ff"/></marker><style>.ey{font:600 16px system-ui;letter-spacing:3px;fill:#66e3c4}.t{font:700 42px system-ui;fill:#f8fbff}.h{font:700 21px system-ui;fill:#f8fbff}.b{font:500 17px system-ui;fill:#afbdd2}.mono{font:600 17px ui-monospace,monospace;fill:#dfe9fa}.dark{font:650 17px system-ui;fill:#17243a}.edge{stroke:#7ea6ff;stroke-width:4;fill:none;marker-end:url(#a4)}</style></defs>
  <rect width="1280" height="720" fill="url(#bg4)"/><text x="72" y="67" class="ey">MERGE-FRIENDLY BY CONSTRUCTION</text><text x="72" y="119" class="t">Flat records let parallel review lanes stay independent</text>
  <g id="semantic-target" filter="url(#sh4)"><rect x="70" y="214" width="285" height="146" rx="22" fill="#172a44" stroke="#66e3c4" stroke-width="3"/><text x="98" y="254" class="h">Semantic target</text><text x="98" y="292" class="mono">…:slide:storage</text><text x="98" y="326" class="mono">…:item:path-budget</text></g>
  <path d="M355 287h100" class="edge"/>
  <g id="compact-records" filter="url(#sh4)"><rect x="466" y="174" width="346" height="302" rx="22" fill="#13233a" stroke="#7ea6ff" stroke-width="3"/><text x="496" y="215" class="h">Deterministic compact files</text><g transform="translate(496 243)"><rect width="286" height="42" rx="8" fill="#213755"/><rect y="55" width="286" height="42" rx="8" fill="#213755"/><rect y="110" width="286" height="42" rx="8" fill="#213755"/><rect y="165" width="286" height="42" rx="8" fill="#213755"/><text x="16" y="27" class="mono">20-s-…-0010-….json</text><text x="16" y="82" class="mono">30-i-…-0010-….json</text><text x="16" y="137" class="mono">40-e-…-….json</text><text x="16" y="192" class="mono">84-r-…-….json</text></g></g>
  <path d="M812 287h100" class="edge"/>
  <g id="independent-reviews" filter="url(#sh4)"><rect x="922" y="214" width="288" height="146" rx="22" fill="#172a44" stroke="#ffce73" stroke-width="3"/><text x="950" y="254" class="h">Independent writes</text><circle cx="975" cy="296" r="13" fill="#66e3c4"/><text x="1001" y="302" class="b">AI reviewer</text><circle cx="975" cy="330" r="13" fill="#7ea6ff"/><text x="1001" y="336" class="b">Human reviewer</text></g>
  <g id="path-budget-callout"><path d="M640 477v65" stroke="#ffce73" stroke-width="3"/><circle cx="640" cy="478" r="6" fill="#ffce73"/><rect x="339" y="540" width="602" height="103" rx="18" fill="#ffce73"/><text x="367" y="575" class="dark">SURPRISE · Human-readable paths were intentionally removed.</text><text x="367" y="605" class="dark" font-weight="500">Meaning stays in JSON; 64-char names and a 240-char path budget</text><text x="367" y="630" class="dark" font-weight="500">survive deep workspaces without forcing every tool into long-path mode.</text></g>
</svg>
