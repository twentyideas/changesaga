<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A projection layer reuses the mature review runtime</title>
  <desc id="desc">The v4 loader projects deck, slide, and item records into the established internal section, fragment, and landmark shapes used by review and evidence services.</desc>
  <defs><linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081529"/><stop offset="1" stop-color="#201831"/></linearGradient><filter id="sh5"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#7ea6ff"/></marker><style>.ey{font:600 16px system-ui;letter-spacing:3px;fill:#66e3c4}.t{font:700 42px system-ui;fill:#f8fbff}.h{font:700 21px system-ui;fill:#f8fbff}.b{font:500 17px system-ui;fill:#afbdd2}.mono{font:600 15px ui-monospace,monospace;fill:#dae7fb}.dark{font:650 17px system-ui;fill:#17243a}.edge{stroke:#7ea6ff;stroke-width:4;fill:none;marker-end:url(#a5)}</style></defs>
  <rect width="1280" height="720" fill="url(#bg5)"/><text x="72" y="67" class="ey">COMPATIBILITY INSIDE, NOT ON DISK</text><text x="72" y="119" class="t">A projection layer reuses the mature review runtime</text>
  <g id="v4-loader" filter="url(#sh5)"><path d="M72 189h320v314H72z" rx="20" fill="#14253d" stroke="#66e3c4" stroke-width="3"/><text x="104" y="231" class="h">V4 loader</text><text x="104" y="269" class="mono">Deck</text><text x="104" y="309" class="mono">  └─ Slide</text><text x="104" y="349" class="mono">      └─ Item</text><text x="104" y="407" class="b">Validates flat identity,</text><text x="104" y="435" class="b">reading order, assets,</text><text x="104" y="463" class="b">and evidence ownership.</text></g>
  <path d="M392 346h101" class="edge"/>
  <g id="projection-adapter" filter="url(#sh5)"><path d="M505 220l150-31 150 31v252l-150 31-150-31z" fill="#253450" stroke="#ffce73" stroke-width="3"/><text x="547" y="276" class="h">projectDecks</text><path d="M556 308h198M556 344h198M556 380h198" stroke="#758baa" stroke-width="3"/><text x="555" y="431" class="b">in-memory adapter</text></g>
  <path d="M805 346h101" class="edge"/>
  <g id="existing-runtime" filter="url(#sh5)"><rect x="918" y="189" width="290" height="314" rx="20" fill="#14253d" stroke="#7ea6ff" stroke-width="3"/><text x="950" y="231" class="h">Established runtime</text><g transform="translate(950 266)"><rect width="226" height="48" rx="10" fill="#213755"/><rect y="65" width="226" height="48" rx="10" fill="#213755"/><rect y="130" width="226" height="48" rx="10" fill="#213755"/><text x="18" y="30" class="b">Evidence resolution</text><text x="18" y="95" class="b">Review sessions</text><text x="18" y="160" class="b">Code drawer + locate</text></g><text x="950" y="476" class="b">New slide shell above it.</text></g>
  <g id="reuse-callout"><path d="M655 503v44" stroke="#ffce73" stroke-width="3"/><circle cx="655" cy="503" r="6" fill="#ffce73"/><rect x="315" y="545" width="680" height="100" rx="18" fill="#ffce73"/><text x="343" y="579" class="dark">SURPRISE · The new hierarchy is projected into legacy internal shapes.</text><text x="343" y="608" class="dark" font-weight="500">That hidden coupling preserves proven evidence/review behavior without</text><text x="343" y="633" class="dark" font-weight="500">pretending the on-disk v4 document is still a report.</text></g>
</svg>
