<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">Disposable comparison generation lifecycle</title><desc id="desc">The shell is independent from comparison generation. Content fingerprints address immutable cache entries, and review mutations are stored separately.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="590" rx="26" fill="#f8fafc"/>
  <text x="48" y="56" font-family="system-ui" font-size="27" font-weight="700" fill="#0f172a">Identity is cheap; comparison detail is disposable</text>
  <g id="shell"><rect x="48" y="116" width="260" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="156" font-family="system-ui" font-size="19" font-weight="700" fill="#1e3a8a">Aggregate shell</text><text x="72" y="191" font-family="system-ui" font-size="15" fill="#1d4ed8"><tspan x="72">Saga identity + outline</tspan><tspan x="72" dy="26">No git diff subprocess</tspan><tspan x="72" dy="26">Navigable immediately</tspan></text></g>
  <g id="fingerprint"><rect x="390" y="116" width="260" height="150" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="414" y="156" font-family="system-ui" font-size="19" font-weight="700" fill="#7c2d12">Content fingerprint</text><text x="414" y="191" font-family="system-ui" font-size="15" fill="#c2410c"><tspan x="414">Saga tree + comparison</tspan><tspan x="414" dy="26">Address, not invalidation</tspan><tspan x="414" dy="26">Miss is always safe</tspan></text></g>
  <g id="cache"><rect x="732" y="116" width="260" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="756" y="156" font-family="system-ui" font-size="19" font-weight="700" fill="#14532d">Immutable generation</text><text x="756" y="191" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="756">Atomic write + rename</tspan><tspan x="756" dy="26">Compressed shared fields</tspan><tspan x="756" dy="26">Rebuildable on deletion</tspan></text></g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M308 190H390"/><path d="M650 190H732"/><path d="M862 266V350"/><path d="M178 266V350"/></g>
  <g id="lazy-detail"><rect x="48" y="350" width="430" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="72" y="390" font-family="system-ui" font-size="19" font-weight="700" fill="#4c1d95">Lazy detailed session</text><text x="72" y="425" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="72">Built only for a detail-bearing endpoint</tspan><tspan x="72" dy="26">Shared generation remains immutable</tspan><tspan x="72" dy="26">Concurrent readers reuse the same result</tspan></text></g>
  <g id="mutations"><rect x="562" y="350" width="430" height="150" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="586" y="390" font-family="system-ui" font-size="19" font-weight="700" fill="#881337">Review mutations stay separate</text><text x="586" y="425" font-family="system-ui" font-size="15" fill="#be123c"><tspan x="586">Decisions, comments, approvals</tspan><tspan x="586" dy="26">Append through focused mutation APIs</tspan><tspan x="586" dy="26">Never invalidate comparison data</tspan></text></g>
</svg>
