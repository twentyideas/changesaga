<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Whole-codebase review pipeline</title>
  <desc id="desc">Five linked stages turn source changes into a progressively revealed review without loading the whole saga into any one browser surface.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#f8fafc"/>
  <text x="56" y="62" font-family="system-ui" font-size="28" font-weight="700" fill="#0f172a">From 532,290 atoms to one reviewer action</text>
  <text x="56" y="94" font-family="system-ui" font-size="16" fill="#475569">Every box is a code-linked design boundary; arrows are the data flow.</text>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M238 230 H285"/><path d="M442 230 H489"/><path d="M646 230 H693"/><path d="M850 230 H897"/>
  </g>
  <g id="evidence-shape" filter="url(#shadow)"><rect x="48" y="150" width="190" height="160" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="72" y="190" font-family="system-ui" font-size="19" font-weight="700" fill="#4c1d95">1 · Evidence shape</text><text x="72" y="224" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="72" dy="0">Canonical dense ranges</tspan><tspan x="72" dy="24">Stable conflict names</tspan><tspan x="72" dy="24">No format migration</tspan></text></g>
  <g id="linear-core" filter="url(#shadow)"><rect x="285" y="150" width="157" height="160" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="309" y="190" font-family="system-ui" font-size="19" font-weight="700" fill="#1e3a8a">2 · Linear core</text><text x="309" y="224" font-family="system-ui" font-size="15" fill="#1d4ed8"><tspan x="309" dy="0">Atom positions</tspan><tspan x="309" dy="24">Selector lookup</tspan><tspan x="309" dy="24">Summary sessions</tspan></text></g>
  <g id="generation" filter="url(#shadow)"><rect x="489" y="150" width="157" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="513" y="190" font-family="system-ui" font-size="19" font-weight="700" fill="#14532d">3 · Generation</text><text x="513" y="224" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="513" dy="0">Immutable snapshot</tspan><tspan x="513" dy="24">Atomic cache</tspan><tspan x="513" dy="24">Lazy full detail</tspan></text></g>
  <g id="bounded-api" filter="url(#shadow)"><rect x="693" y="150" width="157" height="160" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="717" y="190" font-family="system-ui" font-size="19" font-weight="700" fill="#7c2d12">4 · Bounded API</text><text x="717" y="224" font-family="system-ui" font-size="15" fill="#c2410c"><tspan x="717" dy="0">Shell first</tspan><tspan x="717" dy="24">Cursor pages</tspan><tspan x="717" dy="24">Per-file bodies</tspan></text></g>
  <g id="reviewer-flow" filter="url(#shadow)"><rect x="897" y="150" width="175" height="160" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="921" y="190" font-family="system-ui" font-size="19" font-weight="700" fill="#881337">5 · Reviewer flow</text><text x="921" y="224" font-family="system-ui" font-size="15" fill="#be123c"><tspan x="921" dy="0">Hover prefetch</tspan><tspan x="921" dy="24">Live link counts</tspan><tspan x="921" dy="24">Streaming coverage</tspan></text></g>
  <g id="invariant"><rect x="184" y="374" width="752" height="82" rx="18" fill="#0f172a"/><text x="560" y="408" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="white">Invariant: detail work is proportional to the item the reviewer opened</text><text x="560" y="436" text-anchor="middle" font-family="system-ui" font-size="15" fill="#cbd5e1">Global identity and counts may be shared; fragment bodies, ownership lists, and diff rows stay lazy.</text></g>
</svg>
