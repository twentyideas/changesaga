<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Bounded review surfaces</title><desc id="desc">A small shell progressively asks for section, fragment, code, and coverage projections. No response contains the entire chapter or comparison.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1080" height="620" rx="26" fill="#f8fafc"/>
  <text x="48" y="55" font-family="system-ui" font-size="27" font-weight="700" fill="#0f172a">The browser never receives “the saga”</text>
  <g id="ssr-shell"><rect x="48" y="105" width="984" height="90" rx="18" fill="#0f172a"/><text x="540" y="142" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="700" fill="white">SSR shell: identity · outline · descriptors · controls</text><text x="540" y="170" text-anchor="middle" font-family="system-ui" font-size="15" fill="#cbd5e1">Useful before the comparison generation exists</text></g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M540 195V244"/><path d="M195 335V403"/><path d="M425 335V403"/><path d="M655 335V403"/><path d="M885 335V403"/></g>
  <g id="cursor-contract"><rect x="310" y="244" width="460" height="91" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="540" y="279" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#7c2d12">Cursor + byte + item budgets</text><text x="540" y="307" text-anchor="middle" font-family="system-ui" font-size="15" fill="#c2410c">Every list response says whether and where to continue</text></g>
  <g id="section-api"><rect x="60" y="403" width="270" height="145" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="84" y="442" font-family="system-ui" font-size="18" font-weight="700" fill="#1e3a8a">Narrative</text><text x="84" y="476" font-family="system-ui" font-size="15" fill="#1d4ed8"><tspan x="84">Section descriptors</tspan><tspan x="84" dy="25">One fragment body</tspan><tspan x="84" dy="25">Deep-link locate</tspan></text></g>
  <g id="code-api"><rect x="360" y="403" width="210" height="145" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="384" y="442" font-family="system-ui" font-size="18" font-weight="700" fill="#14532d">Code</text><text x="384" y="476" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="384">File summaries</tspan><tspan x="384" dy="25">One diff page</tspan><tspan x="384" dy="25">Reverse owners</tspan></text></g>
  <g id="coverage-api"><rect x="600" y="403" width="210" height="145" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="624" y="442" font-family="system-ui" font-size="18" font-weight="700" fill="#4c1d95">Coverage</text><text x="624" y="476" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="624">File/target pages</tspan><tspan x="624" dy="25">Lazy ownership</tspan><tspan x="624" dy="25">Lazy diff rows</tspan></text></g>
  <g id="review-api"><rect x="840" y="403" width="180" height="145" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="864" y="442" font-family="system-ui" font-size="18" font-weight="700" fill="#881337">Review state</text><text x="864" y="476" font-family="system-ui" font-size="15" fill="#be123c"><tspan x="864">Focused writes</tspan><tspan x="864" dy="25">State rebasing</tspan><tspan x="864" dy="25">No full reload</tspan></text></g>
</svg>
