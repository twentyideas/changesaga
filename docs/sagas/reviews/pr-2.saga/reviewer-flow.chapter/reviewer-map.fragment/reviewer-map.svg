<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer interaction state machine</title><desc id="desc">Fragment hover starts a cancellable target summary request, completion updates every code-link alias, clicking promotes the same request and loads file detail on demand. Coverage pages load continuously.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1080" height="650" rx="26" fill="#f8fafc"/>
  <text x="48" y="55" font-family="system-ui" font-size="27" font-weight="700" fill="#0f172a">Intent warms summaries; clicks still control detail</text>
  <g id="hover-intent"><rect x="48" y="115" width="240" height="135" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="154" font-family="system-ui" font-size="18" font-weight="700" fill="#1e3a8a">Fragment hover / focus</text><text x="72" y="188" font-family="system-ui" font-size="15" fill="#1d4ed8"><tspan x="72">160 ms intent delay</tspan><tspan x="72" dy="25">Queue target + children</tspan></text></g>
  <g id="prefetch-queue"><rect x="420" y="115" width="240" height="135" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="444" y="154" font-family="system-ui" font-size="18" font-weight="700" fill="#7c2d12">Cancellable queue</text><text x="444" y="188" font-family="system-ui" font-size="15" fill="#c2410c"><tspan x="444">2 speculative requests</tspan><tspan x="444" dy="25">64-entry summary cache</tspan></text></g>
  <g id="materialize-counts"><rect x="792" y="115" width="240" height="135" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="816" y="154" font-family="system-ui" font-size="18" font-weight="700" fill="#14532d">Immediate UI update</text><text x="816" y="188" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="816">Heading + citations</tspan><tspan x="816" dy="25">SVG hotspots + aliases</tspan></text></g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M288 182H420"/><path d="M660 182H792"/><path d="M912 250V330"/><path d="M540 250V330"/><path d="M168 250V330"/></g>
  <g id="cancel"><rect x="48" y="330" width="240" height="135" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="72" y="369" font-family="system-ui" font-size="18" font-weight="700" fill="#991b1b">Pointer leaves</text><text x="72" y="403" font-family="system-ui" font-size="15" fill="#b91c1c"><tspan x="72">Cancel queued work</tspan><tspan x="72" dy="25">Abort unneeded fetch</tspan></text></g>
  <g id="click-promote"><rect x="420" y="330" width="240" height="135" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="444" y="369" font-family="system-ui" font-size="18" font-weight="700" fill="#4c1d95">Reviewer clicks</text><text x="444" y="403" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="444">Promote pending work</tspan><tspan x="444" dy="25">Open one file on demand</tspan></text></g>
  <g id="reverse-navigation"><rect x="792" y="330" width="240" height="135" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="816" y="369" font-family="system-ui" font-size="18" font-weight="700" fill="#1e293b">Bidirectional jump</text><text x="816" y="403" font-family="system-ui" font-size="15" fill="#475569"><tspan x="816">Narrative → code</tspan><tspan x="816" dy="25">Code → explanations</tspan></text></g>
  <g id="coverage-stream"><rect x="180" y="520" width="720" height="86" rx="18" fill="#0f172a"/><text x="540" y="555" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="700" fill="white">Coverage continuously appends summaries</text><text x="540" y="583" text-anchor="middle" font-family="system-ui" font-size="15" fill="#cbd5e1">Expanding one summary lazy-loads only its ownership and diff detail.</text></g>
</svg>
