<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Linear review construction</title><desc id="desc">Parsed diff atoms receive integer positions, coverage writes ownership by position, and review lookup uses stable selector keys instead of nested scans.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="560" rx="26" fill="#f8fafc"/>
  <text x="48" y="56" font-family="system-ui" font-size="27" font-weight="700" fill="#0f172a">One position, one ownership decision, one lookup</text>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M284 220H376"/><path d="M664 220H756"/></g>
  <g id="atoms"><rect x="48" y="120" width="236" height="200" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="160" font-family="system-ui" font-size="19" font-weight="700" fill="#1e3a8a">Git diff atoms</text><text x="72" y="198" font-family="ui-monospace" font-size="15" fill="#1d4ed8"><tspan x="72">position 0</tspan><tspan x="72" dy="27">position 1</tspan><tspan x="72" dy="27">position 2</tspan><tspan x="72" dy="27">…</tspan></text></g>
  <g id="coverage-index"><rect x="376" y="120" width="288" height="200" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="400" y="160" font-family="system-ui" font-size="19" font-weight="700" fill="#14532d">Positional coverage state</text><text x="400" y="198" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="400">Dense primary-owner array</tspan><tspan x="400" dy="27">Sparse overlap map</tspan><tspan x="400" dy="27">Per-target atom positions</tspan><tspan x="400" dy="27">No copied atom structs</tspan></text></g>
  <g id="selector-index"><rect x="756" y="120" width="236" height="200" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="780" y="160" font-family="system-ui" font-size="19" font-weight="700" fill="#4c1d95">Review selector index</text><text x="780" y="198" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="780">target + evidence path</tspan><tspan x="780" dy="27">+ diff index → selector</tspan><tspan x="780" dy="27">O(1) ownership link</tspan><tspan x="780" dy="27">Stable reverse lookup</tspan></text></g>
  <g id="summary-mode"><rect x="184" y="382" width="672" height="108" rx="18" fill="#0f172a"/><text x="520" y="422" text-anchor="middle" font-family="system-ui" font-size="19" font-weight="700" fill="white">Overview and children stop here</text><text x="520" y="454" text-anchor="middle" font-family="system-ui" font-size="15" fill="#cbd5e1">Aggregate queries skip detail-only ownership strings and selector projections.</text></g>
</svg>
