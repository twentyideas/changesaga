<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Evidence representation decision</title><desc id="desc">Measurements narrow a proposed connector format into three smaller changes to the existing v2 format and implementation.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="560" rx="26" fill="#fafafa"/>
  <text x="48" y="54" font-family="system-ui" font-size="27" font-weight="700" fill="#111827">The experiment changed the decision</text>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M276 205H372"/><path d="M668 205H764"/><path d="M520 290V365"/></g>
  <g id="baseline"><rect x="48" y="120" width="228" height="170" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="72" y="158" font-family="system-ui" font-size="19" font-weight="700" fill="#991b1b">Measured pathology</text><text x="72" y="194" font-family="system-ui" font-size="15" fill="#b91c1c"><tspan x="72">230.36 MB evidence</tspan><tspan x="72" dy="25">532,290 references</tspan><tspan x="72" dy="25">17m 30s overview</tspan></text></g>
  <g id="experiment"><rect x="372" y="120" width="296" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="396" y="158" font-family="system-ui" font-size="19" font-weight="700" fill="#4c1d95">Connector prototype</text><text x="396" y="194" font-family="system-ui" font-size="15" fill="#5b21b6"><tspan x="396">Compact shards + equivalence</tspan><tspan x="396" dy="25">Disposable SQLite index</tspan><tspan x="396" dy="25">Real Git merge scenarios</tspan></text></g>
  <g id="decision"><rect x="764" y="120" width="228" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="788" y="158" font-family="system-ui" font-size="19" font-weight="700" fill="#14532d">Keep format v2</text><text x="788" y="194" font-family="system-ui" font-size="15" fill="#15803d"><tspan x="788">Ranges capture the win</tspan><tspan x="788" dy="25">No core dependency</tspan><tspan x="788" dy="25">No migration burden</tspan></text></g>
  <g id="range-fix"><rect x="96" y="365" width="250" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="404" font-family="system-ui" font-size="18" font-weight="700" fill="#1e3a8a">Canonical range authoring</text><text x="120" y="438" font-family="system-ui" font-size="15" fill="#1d4ed8"><tspan x="120">Coalesce only gapless atoms</tspan><tspan x="120" dy="24">Normalize manual ranges</tspan></text></g>
  <g id="conflict-fix"><rect x="395" y="365" width="250" height="130" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="419" y="404" font-family="system-ui" font-size="18" font-weight="700" fill="#7c2d12">Intentional merge conflicts</text><text x="419" y="438" font-family="system-ui" font-size="15" fill="#c2410c"><tspan x="419">Name from selector identity</tspan><tspan x="419" dy="24">Exclude explanation note</tspan></text></g>
  <g id="compatibility"><rect x="694" y="365" width="250" height="130" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="718" y="404" font-family="system-ui" font-size="18" font-weight="700" fill="#1e293b">Compatibility boundary</text><text x="718" y="438" font-family="system-ui" font-size="15" fill="#475569"><tspan x="718">Prototype stays isolated</tspan><tspan x="718" dy="24">CLI remains dependency-light</tspan></text></g>
</svg>
