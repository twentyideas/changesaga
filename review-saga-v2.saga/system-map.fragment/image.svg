<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Review Saga system map</title><desc id="desc">Source changes and authored narrative converge in validation and coverage, then render for a reviewer whose feedback is written as an append-only overlay.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#316b58"/></marker><style>.box{fill:#fffdf8;stroke:#b9c9c0;stroke-width:2}.accent{fill:#e4f2ea;stroke:#316b58}.review{fill:#fff0d9;stroke:#b97620}.t{font:600 23px system-ui;fill:#183127}.s{font:16px system-ui;fill:#53675d}.a{fill:none;stroke:#316b58;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="640" rx="28" fill="#f3f0e7"/>
  <text x="60" y="58" class="t" font-size="30">One coherent change, several reviewable journeys</text>
  <rect class="box" x="60" y="110" width="285" height="120" rx="18"/><text class="t" x="92" y="154">Git comparison</text><text class="s" x="92" y="186">lines · renames · binaries · modes</text>
  <rect class="box" x="60" y="350" width="285" height="150" rx="18"/><text class="t" x="92" y="394">Authored saga</text><text class="s" x="92" y="426">overview → chapters → sections</text><text class="s" x="92" y="454">Markdown · SVG · HTML · images</text>
  <rect class="accent" x="455" y="205" width="290" height="190" rx="20"/><text class="t" x="497" y="255">Engine + CLI</text><text class="s" x="497" y="290">strict structure validation</text><text class="s" x="497" y="320">absolute diff identity</text><text class="s" x="497" y="350">complete evidence accounting</text>
  <rect class="box" x="855" y="105" width="285" height="150" rx="18"/><text class="t" x="892" y="150">Saga view</text><text class="s" x="892" y="182">narrative first</text><text class="s" x="892" y="212">attached-code drawer</text>
  <rect class="box" x="855" y="315" width="285" height="150" rx="18"/><text class="t" x="892" y="360">Code Diff view</text><text class="s" x="892" y="392">complete file tree</text><text class="s" x="892" y="422">same line discussions</text>
  <rect class="review" x="455" y="520" width="685" height="82" rx="18"/><text class="t" x="493" y="554">Append-only review overlay</text><text class="s" x="493" y="580">comments · replies · drawings · suggestions · approvals · reviewed files</text>
  <path class="a" d="M345 170C405 170 410 240 455 265"/><path class="a" d="M345 425C405 425 410 365 455 340"/><path class="a" d="M745 265C800 245 805 190 855 180"/><path class="a" d="M745 335C800 350 805 390 855 390"/><path class="a" d="M997 255v60"/><path class="a" d="M997 465v55"/>
</svg>
