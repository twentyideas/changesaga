<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Unified review shell</title><desc id="desc">Saga view presents narrative cards with an attached-code drawer, Code Diff view presents a file tree and full comparison, and the shared navigation includes a bidirectional Coverage Manifest.</desc>
  <style>.frame{fill:#fff;stroke:#bfc8c2;stroke-width:2}.top{fill:#183129}.side{fill:#ebe7db}.card{fill:#fffdf8;stroke:#d7d1c3}.drawer{fill:#f8f7f2;stroke:#8ba398;stroke-width:3}.code{fill:#202620}.green{fill:#193b29}.t{font:600 20px system-ui;fill:#183129}.w{font:600 17px system-ui;fill:#fff}.s{font:14px system-ui;fill:#66746d}.line{stroke:#8fd0aa;stroke-width:8}</style>
  <rect width="1200" height="650" rx="28" fill="#f3f0e7"/>
  <text class="t" x="50" y="48" font-size="27">The reviewer changes context, not review semantics</text>
  <g id="saga-view-shell"><rect class="frame" x="50" y="80" width="525" height="510" rx="15"/><rect class="top" x="50" y="80" width="525" height="52" rx="15"/><text class="w" x="78" y="112">Saga   |   Code Diff   |   Manifest</text><rect class="side" x="50" y="132" width="150" height="458"/><text class="t" x="70" y="170">Story</text><text class="s" x="70" y="202">Overview</text><text class="s" x="70" y="228">Chapter 1</text><text class="s" x="70" y="254">Chapter 2</text><rect class="card" x="225" y="160" width="320" height="155" rx="13"/><text class="t" x="250" y="200">Narrative fragment</text><text class="s" x="250" y="230">diagram · explanation · risks</text><rect class="drawer" x="315" y="270" width="260" height="320"/><text class="t" x="340" y="307">3 linked files</text><rect class="card" x="335" y="326" width="220" height="58" rx="7"/><text class="s" x="350" y="349">› internal/server/server.go</text><text class="s" x="350" y="370">Builds the linked view model</text><rect class="card" x="335" y="394" width="220" height="58" rx="7"/><text class="s" x="350" y="417">› internal/server/template.go</text><text class="s" x="350" y="438">Renders the review shell</text><rect class="card" x="335" y="462" width="220" height="58" rx="7"/><text class="s" x="350" y="485">› internal/server/appjs.go</text><text class="s" x="350" y="506">Drives drawer interaction</text><text class="s" x="340" y="552">Expand one file when ready</text></g>
  <g id="code-diff-shell"><rect class="frame" x="625" y="80" width="525" height="510" rx="15"/><rect class="top" x="625" y="80" width="525" height="52" rx="15"/><text class="w" x="653" y="112">Saga   |   Code Diff   |   Manifest</text><rect class="side" x="625" y="132" width="175" height="458"/><text class="t" x="645" y="170">Changed files</text><text class="s" x="645" y="205">internal/server</text><text class="s" x="645" y="233">internal/saga</text><text class="s" x="645" y="261">SPEC.md</text><rect class="code" x="825" y="160" width="300" height="360" rx="9"/><text class="w" x="845" y="192">internal/server/server.go</text><path class="line" d="M845 235h230M845 275h185M845 315h245M845 355h205M845 395h235"/><text class="w" x="845" y="460">Same threads and suggestions</text><text class="s" x="825" y="558">✓ Mark reviewed · persisted as an event file</text></g>
</svg>
