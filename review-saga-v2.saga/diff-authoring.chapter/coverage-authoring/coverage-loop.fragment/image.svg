<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Review Saga authoring and coverage loop</title><desc id="desc">An author reads uncovered changes, understands them, creates narrative fragments and chapters, attaches evidence, and repeats validation until the saga is ready.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2d6b55"/></marker><style>.b{fill:#fff;stroke:#abc3b7;stroke-width:2}.n{fill:#e3f1e8;stroke:#2d6b55;stroke-width:2}.t{font:600 20px system-ui;fill:#18382b}.s{font:15px system-ui;fill:#586b62}.p{fill:none;stroke:#2d6b55;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1180" height="520" rx="26" fill="#f4f1e8"/><text class="t" x="55" y="55" font-size="28">Coverage is a work queue, not a quality score</text>
  <g id="inspect"><rect class="b" x="55" y="120" width="205" height="120" rx="17"/><text class="t" x="82" y="160">1 · Inspect</text><text class="s" x="82" y="190">PR intent + full diff</text><text class="s" x="82" y="216">status --json</text></g>
  <g id="understand"><rect class="b" x="330" y="120" width="205" height="120" rx="17"/><text class="t" x="357" y="160">2 · Understand</text><text class="s" x="357" y="190">behavior and risk</text><text class="s" x="357" y="216">not file extensions</text></g>
  <g id="explain"><rect class="b" x="605" y="120" width="205" height="120" rx="17"/><text class="t" x="632" y="160">3 · Explain</text><text class="s" x="632" y="190">overview + chapters</text><text class="s" x="632" y="216">focused fragments</text></g>
  <g id="attach-evidence"><rect class="b" x="880" y="120" width="245" height="120" rx="17"/><text class="t" x="907" y="160">4 · Attach evidence</text><text class="s" x="907" y="190">most focused target</text><text class="s" x="907" y="216">old/new + events</text></g>
  <g id="validate-readiness"><rect class="n" x="350" y="340" width="480" height="115" rx="18"/><text class="t" x="382" y="382">5 · Validate reviewer readiness</text><text class="s" x="382" y="412">uncovered = 0 · stale = 0 · overlaps justified</text><text class="s" x="382" y="438">then read the story without author-only context</text></g>
  <path class="p" d="M260 180h70M535 180h70M810 180h70M1000 240c0 100-110 158-170 158"/><path class="p" d="M350 398C160 398 120 300 157 240"/>
</svg>
