<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Attribution and security boundaries</title><desc id="desc">The local browser crosses a guarded loopback HTTP boundary. Diff identities are checked against the Saga repository before review writes. Separately, record file paths are resolved within the Saga repository and attributed to the commit that introduced each independent record.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52636c"/></marker><style>.bg{fill:#f7f5ef}.node{fill:#fff;stroke:#263746;stroke-width:2}.trust{fill:#eef5f4;stroke:#2f6c67;stroke-width:2}.deny{fill:#fff0ec;stroke:#9d4f39;stroke-width:2}.edge{fill:none;stroke:#52636c;stroke-width:3;marker-end:url(#arr)}.title{font:700 19px system-ui;fill:#17232d}.text{font:14px system-ui;fill:#44515a}.label{font:700 13px system-ui;fill:#596770}.zone{font:800 13px system-ui;letter-spacing:.08em;fill:#6a6259}</style></defs><rect class="bg" width="1200" height="650" rx="20"/><text class="zone" x="46" y="42">MUTATION TRUST PATH</text>
<g id="trust-browser-node"><rect class="node" x="55" y="85" width="230" height="130" rx="14"/><text class="title" x="170" y="124" text-anchor="middle">Local browser</text><text class="text" x="170" y="155" text-anchor="middle">same-origin UI</text><text class="text" x="170" y="181" text-anchor="middle">session mutation token</text></g>
<g id="trust-http-gate-node"><rect class="trust" x="470" y="85" width="260" height="130" rx="14"/><text class="title" x="600" y="124" text-anchor="middle">HTTP security gate</text><text class="text" x="600" y="155" text-anchor="middle">loopback listener + Host</text><text class="text" x="600" y="181" text-anchor="middle">Fetch-Site + body limits</text></g><path id="trust-request-edge" class="edge" d="M285 150H462"/><text class="label" x="373" y="136" text-anchor="middle">POST mutation</text>
<g id="trust-repository-check-node"><rect class="trust" x="895" y="85" width="250" height="130" rx="14"/><text class="title" x="1020" y="124" text-anchor="middle">Repository identity</text><text class="text" x="1020" y="155" text-anchor="middle">diff URI repository</text><text class="text" x="1020" y="181" text-anchor="middle">must equal Saga source</text></g><path id="trust-identity-edge" class="edge" d="M730 150H887"/><text class="label" x="808" y="136" text-anchor="middle">validate anchor</text>
<g id="trust-denial-node"><rect class="deny" x="470" y="285" width="260" height="105" rx="14"/><text class="title" x="600" y="326" text-anchor="middle">Rejected before write</text><text class="text" x="600" y="356" text-anchor="middle">no partial review entity</text></g><path id="trust-denial-edge" class="edge" d="M600 215V277"/>
<text class="zone" x="46" y="456">ATTRIBUTION READ PATH</text><g id="trust-record-node"><rect class="node" x="55" y="490" width="230" height="105" rx="14"/><text class="title" x="170" y="530" text-anchor="middle">Independent record file</text><text class="text" x="170" y="560" text-anchor="middle">thread / message / event</text></g><g id="trust-resolver-node"><rect class="trust" x="470" y="490" width="260" height="105" rx="14"/><text class="title" x="600" y="530" text-anchor="middle">Git attribution resolver</text><text class="text" x="600" y="560" text-anchor="middle">batched status + bounded history</text></g><path id="trust-resolve-edge" class="edge" d="M285 542H462"/><text class="label" x="373" y="528" text-anchor="middle">path within repo</text><g id="trust-committer-node"><rect class="node" x="895" y="490" width="250" height="105" rx="14"/><text class="title" x="1020" y="530" text-anchor="middle">Introducing committer</text><text class="text" x="1020" y="560" text-anchor="middle">OID · name · email · time</text></g><path id="trust-follow-edge" class="edge" d="M730 542H887"/><text class="label" x="808" y="528" text-anchor="middle">git log --follow</text></svg>
