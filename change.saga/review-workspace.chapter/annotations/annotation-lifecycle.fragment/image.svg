<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Annotation state from local draft to append-only history</title><desc id="desc">A browser draft supports undo and redo before submission. The local server validates and routes mutations. New records and later state or anchor events are appended atomically. Reloading folds those files into current presentation without rewriting history.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52636c"/></marker><style>.bg{fill:#f7f5ef}.node{fill:#fff;stroke:#263746;stroke-width:2}.gate{fill:#eef5f4;stroke:#2f6c67;stroke-width:2;stroke-dasharray:8 6}.event{fill:#fff8e8;stroke:#9a6b28;stroke-width:2}.edge{fill:none;stroke:#52636c;stroke-width:3;marker-end:url(#a)}.loop{stroke:#a65b40}.title{font:700 19px system-ui;fill:#17232d}.text{font:14px system-ui;fill:#44515a}.label{font:700 13px system-ui;fill:#5a6670}.zone{font:800 13px system-ui;letter-spacing:.09em;fill:#6a6259}</style></defs>
<rect class="bg" width="1200" height="690" rx="20"/><text class="zone" x="45" y="42">TRANSIENT BROWSER STATE</text><text class="zone" x="45" y="352">COMMITTED GIT-NATIVE STATE</text>
<g id="annotation-draft-node"><rect class="node" x="55" y="78" width="245" height="155" rx="14"/><text class="title" x="177" y="116" text-anchor="middle">Draft annotation</text><text class="text" x="177" y="146" text-anchor="middle">note / highlight / region</text><text class="text" x="177" y="170" text-anchor="middle">rectangle / freehand</text><text class="text" x="177" y="199" text-anchor="middle">normalized coordinates</text></g>
<g id="annotation-history-node"><rect class="node" x="470" y="78" width="245" height="155" rx="14"/><text class="title" x="592" y="116" text-anchor="middle">Draft history</text><text class="text" x="592" y="146" text-anchor="middle">undo stack ⇄ redo stack</text><text class="text" x="592" y="170" text-anchor="middle">move / resize / recolor</text><text class="text" x="592" y="199" text-anchor="middle">no disk mutation yet</text></g>
<path id="annotation-edit-edge" class="edge loop" d="M300 135H462"/><text class="label" x="381" y="122" text-anchor="middle">edit</text><path id="annotation-undo-edge" class="edge loop" d="M470 190H308"/><text class="label" x="389" y="214" text-anchor="middle">undo / redo</text>
<g id="annotation-server-node"><rect class="gate" x="885" y="78" width="255" height="155" rx="14"/><text class="title" x="1012" y="116" text-anchor="middle">Mutation endpoint</text><text class="text" x="1012" y="146" text-anchor="middle">token + request limits</text><text class="text" x="1012" y="170" text-anchor="middle">anchor and target validation</text><text class="text" x="1012" y="199" text-anchor="middle">writer lock</text></g>
<path id="annotation-submit-edge" class="edge" d="M715 155H877"/><text class="label" x="796" y="142" text-anchor="middle">submit</text>
<g id="annotation-thread-node"><rect class="event" x="55" y="405" width="245" height="160" rx="14"/><text class="title" x="177" y="443" text-anchor="middle">New thread entity</text><text class="text" x="177" y="473" text-anchor="middle">thread manifest</text><text class="text" x="177" y="497" text-anchor="middle">independent message fragment</text><text class="text" x="177" y="526" text-anchor="middle">staged, then renamed</text></g>
<g id="annotation-event-node"><rect class="event" x="470" y="405" width="245" height="160" rx="14"/><text class="title" x="592" y="443" text-anchor="middle">Later event file</text><text class="text" x="592" y="473" text-anchor="middle">open / resolved / withdrawn</text><text class="text" x="592" y="497" text-anchor="middle">or replacement anchor</text><text class="text" x="592" y="526" text-anchor="middle">original record remains</text></g>
<g id="annotation-projection-node"><rect class="node" x="885" y="405" width="255" height="160" rx="14"/><text class="title" x="1012" y="443" text-anchor="middle">Reloaded projection</text><text class="text" x="1012" y="473" text-anchor="middle">latest state and anchor</text><text class="text" x="1012" y="497" text-anchor="middle">bubbles and overlays</text><text class="text" x="1012" y="526" text-anchor="middle">history stays append-only</text></g>
<path id="annotation-create-edge" class="edge" d="M1012 233V318H177V397"/><text class="label" x="594" y="306" text-anchor="middle">create complete entity or nothing</text><path id="annotation-append-edge" class="edge" d="M300 485H462"/><text class="label" x="381" y="472" text-anchor="middle">later mutation</text><path id="annotation-reload-edge" class="edge" d="M715 485H877"/><text class="label" x="796" y="472" text-anchor="middle">fold events</text>
</svg>
