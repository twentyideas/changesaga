<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tag-to-install delivery chain</title>
  <desc id="desc">An authorized version tag is validated, tested, built into canonical archives, signed where credentials permit, checksummed and attested, downloaded by an installer, verified, checked for safe archive shape, and atomically installed without elevation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#0f172a;stroke-width:2;rx:14}.gate{fill:#ecfeff;stroke:#0e7490}.trust{fill:#fff7ed;stroke:#c2410c}.out{fill:#f0fdf4;stroke:#15803d}.edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.label{font:600 18px system-ui;fill:#0f172a}.small{font:14px system-ui;fill:#334155}.boundary{fill:none;stroke:#c2410c;stroke-width:2;stroke-dasharray:10 8}.boundary-label{font:600 14px system-ui;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <rect id="release-trust-boundary" class="boundary" x="245" y="40" width="690" height="360" rx="24"/>
  <text x="270" y="68" class="boundary-label">TAG-ONLY RELEASE TRUST BOUNDARY · SIGNING ENVIRONMENT ONLY ON macOS JOB</text>
  <g id="version-tag"><rect class="node" x="40" y="145" width="170" height="95"/><text class="label" x="125" y="180" text-anchor="middle">v0.0.6 tag</text><text class="small" x="125" y="208" text-anchor="middle">authorized ref</text></g>
  <path id="edge-tag-to-metadata" class="edge" d="M210 192 H280"/>
  <g id="metadata-gate"><rect class="node gate" x="280" y="130" width="190" height="125"/><text class="label" x="375" y="168" text-anchor="middle">Resolve metadata</text><text class="small" x="375" y="196" text-anchor="middle">SemVer · commit</text><text class="small" x="375" y="218" text-anchor="middle">default-branch ancestor</text></g>
  <path id="edge-metadata-to-tests" class="edge" d="M470 192 H525"/>
  <g id="verification-gate"><rect class="node gate" x="525" y="130" width="180" height="125"/><text class="label" x="615" y="168" text-anchor="middle">Verify</text><text class="small" x="615" y="196" text-anchor="middle">Go · shell · browser</text><text class="small" x="615" y="218" text-anchor="middle">read-only PR matrix</text></g>
  <path id="edge-tests-to-build" class="edge" d="M705 192 H760"/>
  <g id="archive-build"><rect class="node trust" x="760" y="120" width="150" height="145"/><text class="label" x="835" y="158" text-anchor="middle">Build archives</text><text class="small" x="835" y="186" text-anchor="middle">pinned modes</text><text class="small" x="835" y="208" text-anchor="middle">fixed timestamps</text><text class="small" x="835" y="230" text-anchor="middle">optional macOS sign</text></g>
  <path id="edge-build-to-publish" class="edge" d="M835 265 V330 H985"/>
  <g id="publish-bundle"><rect class="node out" x="945" y="285" width="210" height="125"/><text class="label" x="1050" y="325" text-anchor="middle">Publish bundle</text><text class="small" x="1050" y="353" text-anchor="middle">6 archives · SHA256SUMS</text><text class="small" x="1050" y="375" text-anchor="middle">provenance attestation</text></g>
  <path id="edge-publish-to-fetch" class="edge" d="M1050 410 V470 H850"/>
  <g id="installer-fetch"><rect class="node" x="740" y="450" width="180" height="100"/><text class="label" x="830" y="487" text-anchor="middle">Installer fetch</text><text class="small" x="830" y="516" text-anchor="middle">HTTPS release assets</text></g>
  <path id="edge-fetch-to-checksum" class="edge" d="M740 500 H675"/>
  <g id="checksum-gate"><rect class="node gate" x="475" y="450" width="200" height="100"/><text class="label" x="575" y="487" text-anchor="middle">Verify checksum</text><text class="small" x="575" y="516" text-anchor="middle">failure stops install</text></g>
  <path id="edge-checksum-to-shape" class="edge" d="M475 500 H410"/>
  <g id="archive-shape-gate"><rect class="node gate" x="210" y="450" width="200" height="100"/><text class="label" x="310" y="487" text-anchor="middle">Validate shape</text><text class="small" x="310" y="516" text-anchor="middle">flat regular files only</text></g>
  <path id="edge-shape-to-install" class="edge" d="M210 500 H150 V605 H260"/>
  <g id="atomic-install"><rect class="node out" x="260" y="575" width="280" height="95"/><text class="label" x="400" y="612" text-anchor="middle">Atomic user install</text><text class="small" x="400" y="640" text-anchor="middle">no sudo · no protection bypass</text></g>
  <path id="edge-checksum-failure" class="edge dash" d="M575 550 V622 H690"/>
  <g id="fail-closed"><rect class="node trust" x="690" y="575" width="250" height="95"/><text class="label" x="815" y="612" text-anchor="middle">Stop, preserve old binary</text><text class="small" x="815" y="640" text-anchor="middle">mismatch · unsafe layout · missing tool</text></g>
</svg>
