<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Change Saga system map</title>
  <desc id="desc">A source comparison becomes exact evidence, an AI-authored narrative, a human review workspace, and maintained codebase knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75e6c6"/>
      <stop offset="1" stop-color="#7db7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7db7ff"/>
    </marker>
    <style>
      .label{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f7fafc}
      .small{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#aebbd0}
      .node{fill:#1d2a41;stroke:#526986;stroke-width:1.5}
      .edge{fill:none;stroke:#7db7ff;stroke-width:3;marker-end:url(#arrow)}
      .edge-label{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#75e6c6}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="64" y="58" class="label" font-size="26">The gradual path through a large change</text>
  <text x="64" y="88" class="small">Zoom in only when the current layer raises a question.</text>

  <path id="edge-atomize" class="edge" d="M268 210C320 210 340 210 392 210"/>
  <text x="302" y="193" class="edge-label">atomize</text>
  <path id="edge-author" class="edge" d="M608 210C660 210 680 210 732 210"/>
  <text x="638" y="193" class="edge-label">explain + cite</text>
  <path id="edge-review" class="edge" d="M948 210C1000 210 1020 210 1072 210"/>
  <text x="978" y="193" class="edge-label">inspect</text>
  <path id="edge-maintain" class="edge" d="M840 318C840 402 670 434 600 434C530 434 360 402 360 318"/>
  <text x="512" y="458" class="edge-label">project the next diff onto existing evidence</text>

  <g id="source-comparison" filter="url(#shadow)">
    <rect class="node" x="52" y="132" width="216" height="176" rx="18"/>
    <text x="80" y="178" class="label">Git comparison</text>
    <text x="80" y="214" class="small">changed lines</text>
    <text x="80" y="238" class="small">file lifecycle events</text>
    <text x="80" y="274" class="small" fill="#75e6c6">the ground truth</text>
  </g>

  <g id="portable-evidence" filter="url(#shadow)">
    <rect class="node" x="392" y="132" width="216" height="176" rx="18"/>
    <text x="420" y="178" class="label">Portable evidence</text>
    <text x="420" y="214" class="small">canonical diff URIs</text>
    <text x="420" y="238" class="small">stable narrative targets</text>
    <text x="420" y="274" class="small" fill="#75e6c6">every atom accounted for</text>
  </g>

  <g id="ai-authored-saga" filter="url(#shadow)">
    <rect class="node" x="732" y="132" width="216" height="176" rx="18"/>
    <text x="760" y="178" class="label">AI-authored Saga</text>
    <text x="760" y="214" class="small">overview → chapters</text>
    <text x="760" y="238" class="small">visuals → exact code</text>
    <text x="760" y="274" class="small" fill="#75e6c6">gradual information density</text>
  </g>

  <g id="human-review" filter="url(#shadow)">
    <rect class="node" x="1072" y="132" width="76" height="176" rx="18"/>
    <text x="1092" y="178" class="label" writing-mode="tb">Review</text>
  </g>

  <g id="coverage-not-verdict">
    <rect x="384" y="494" width="432" height="38" rx="19" fill="url(#accent)" opacity=".16"/>
    <text x="600" y="519" text-anchor="middle" class="small">coverage proves accounting—not correctness</text>
  </g>
</svg>
