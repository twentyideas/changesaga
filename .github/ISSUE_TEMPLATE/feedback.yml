name: Feedback
description: Tell us what you think.
body:
  - type: textarea
    id: feedback
    attributes:
      label: What do you think?
      description: Tell us what worked, what did not, or anything you would like changed.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which AI model did you use?
      description: Include the provider and exact model name when possible.
      placeholder: Anthropic / Claude Sonnet 4.6
    validations:
      required: true
