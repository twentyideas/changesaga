name: Feedback
description: Share what worked, what did not, or anything you would like to see changed.
body:
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Tell us what happened in whatever form is useful to you.
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Coding assistant
      description: For example, OpenCode, Codex, Claude Code, Cursor, or another assistant.
      placeholder: OpenCode
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI model and provider
      description: Use the exact model identifier when possible.
      placeholder: OpenCode Zen / ox-alpha-free
    validations:
      required: true
