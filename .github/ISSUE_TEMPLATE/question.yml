name: Question
description: How do I do X? Why does the tool behave this way?
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        [SUPPORT.md](https://github.com/change-saga/change-saga/blob/main/SUPPORT.md)
        answers the questions that come up most — exit code 3, stale URIs after a
        rebase, sagas stored separately from the code, and loopback-only serving.
        If yours is not there, ask away.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you ran
      description: Commands and output, if any.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `change-saga version`.
