name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  GOTOOLCHAIN: local

jobs:
  browser:
    name: ${{ github.event.inputs.browser || 'chromium' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install JavaScript dependencies
        run: npm ci
      - name: install browser
        run: npx playwright install --with-deps "${{ github.event.inputs.browser || 'chromium' }}"
      - name: typecheck
        run: npm run typecheck
      - name: run real-browser suite
        run: npx playwright test --project="${{ github.event.inputs.browser || 'chromium' }}"
      - name: repeat the mutation-heavy critical flows
        run: npx playwright test --project="${{ github.event.inputs.browser || 'chromium' }}" --grep @critical --repeat-each=3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-${{ github.event.inputs.browser || 'chromium' }}-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn
