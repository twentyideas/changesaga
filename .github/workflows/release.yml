# Tagged release: build, sign, checksum, and publish.
#
# Trust boundary
# --------------
# This workflow runs only for tags pushed to this repository and for manual
# dispatch, both of which require write access. There is deliberately no
# `pull_request` or `pull_request_target` trigger, so a pull request from a
# fork can never reach the Apple signing secrets — fork pull requests run
# ci.yml instead, which is read-only and unsigned.
#
# The macOS signing secrets live in the `release-signing` GitHub Environment,
# which adds a second gate: only jobs that name that environment can read them,
# and the environment's protection rules (branch/tag restrictions, and required
# reviewers if configured) apply before those jobs start.
#
# See docs/releasing.md for the secret inventory and the Apple setup steps.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  meta:
    name: resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      source_date_epoch: ${{ steps.resolve.outputs.source_date_epoch }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: resolve and validate the tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
              { echo "::error::tag $tag does not exist"; exit 1; }
          fi
          # Reject anything that is not v<semver>, so artifact names and the
          # installer's tag/version mapping stay predictable.
          numeric='(0|[1-9][0-9]*)'
          prerelease_id="($numeric|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          semver="^v$numeric\\.$numeric\\.$numeric(-$prerelease_id(\\.$prerelease_id)*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
          if ! printf '%s' "$tag" | grep -Eq "$semver"; then
            echo "::error::tag $tag is not of the form v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          version="${tag#v}"
          commit="$(git rev-parse "$tag^{commit}")"
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::pushed tag resolves to $commit, but the event identifies $GITHUB_SHA"
            exit 1
          fi
          # Build metadata may contain hyphens, but only a hyphen before the
          # optional +build section denotes a SemVer prerelease.
          case "${version%%+*}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "source_date_epoch=$source_date_epoch"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$tag does not point to a commit on $DEFAULT_BRANCH"
            exit 1
          fi
          echo "Building $tag (version $version, prerelease $prerelease)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch is a rehearsal only; only a tag-push run can publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    # The same unsigned test matrix a pull request runs. A tag never skips it.
    name: verify
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.meta.outputs.commit }}
    permissions:
      contents: read

  build-unix-windows:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [meta, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: build
        env:
          CHANGE_SAGA_COMMIT: ${{ needs.meta.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
        run: ./scripts/build-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-change-saga-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: build darwin/${{ matrix.goarch }}
    needs: [meta, verify]
    runs-on: macos-latest
    # Naming the environment is what makes the Apple secrets readable here, and
    # only here. Its protection rules gate the job before any step runs.
    environment: release-signing
    strategy:
      fail-fast: true
      matrix:
        goarch: [arm64, amd64]
    outputs:
      signed: ${{ steps.signing.outputs.available }}
      notarized: ${{ steps.signing.outputs.notarization_available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: check for signing credentials
        id: signing
        env:
          # Only emptiness is ever tested; no secret value is printed.
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_MACOS_SIGNING }}
          REQUIRE_NOTARIZATION: ${{ vars.REQUIRE_MACOS_NOTARIZATION }}
        run: ./scripts/macos-release-credentials.sh

      - name: import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/macos-keychain.sh

      - name: build (signed, optionally notarized)
        if: steps.signing.outputs.available == 'true'
        env:
          CHANGE_SAGA_SIGN_HOOK: ${{ github.workspace }}/scripts/macos-sign-hook.sh
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          CHANGE_SAGA_COMMIT: ${{ needs.meta.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
        run: ./scripts/build-release.sh "${{ needs.meta.outputs.version }}" darwin "${{ matrix.goarch }}" dist

      - name: build (unsigned)
        if: steps.signing.outputs.available != 'true'
        env:
          CHANGE_SAGA_COMMIT: ${{ needs.meta.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
        run: ./scripts/build-release.sh "${{ needs.meta.outputs.version }}" darwin "${{ matrix.goarch }}" dist

      - name: verify the archived binary is signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          archive="dist/change-saga_${{ needs.meta.outputs.version }}_darwin_${{ matrix.goarch }}.tar.gz"
          check="$RUNNER_TEMP/verify"
          mkdir -p "$check"
          tar -xzf "$archive" -C "$check"
          codesign --verify --strict --verbose=2 "$check/change-saga"
          codesign --display --verbose=4 "$check/change-saga" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)' || true

      - name: delete the signing keychain
        if: always()
        run: |
          if [ -n "${CHANGE_SAGA_KEYCHAIN:-}" ] && [ -f "$CHANGE_SAGA_KEYCHAIN" ]; then
            security delete-keychain "$CHANGE_SAGA_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/saga-signing.p12" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-change-saga-darwin-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  prepare:
    name: verify and prepare release bundle
    needs: [meta, build-unix-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-change-saga-*
          merge-multiple: true
          path: dist

      - name: verify per-artifact checksums and build SHA256SUMS
        working-directory: dist
        env:
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.meta.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          # Each build job recorded a checksum next to its archive. Re-checking
          # here proves the artifact survived the upload/download round trip
          # before it becomes the published SHA256SUMS entry.
          archive_count="$(find . -maxdepth 1 -type f \( -name 'change-saga_*.tar.gz' -o -name 'change-saga_*.zip' \) | wc -l)"
          sidecar_count="$(find . -maxdepth 1 -type f -name 'change-saga_*.sha256' | wc -l)"
          if [ "$archive_count" -ne 6 ] || [ "$sidecar_count" -ne 6 ]; then
            echo "::error::expected six archives and six checksum sidecars; found $archive_count and $sidecar_count"
            find . -maxdepth 1 -type f -print | sort
            exit 1
          fi
          for sidecar in change-saga_*.sha256; do
            sha256sum -c "$sidecar"
          done
          rm -f SHA256SUMS
          sha256sum change-saga_*.tar.gz change-saga_*.zip | sort -k2 > SHA256SUMS
          expected=6
          actual="$(grep -c . SHA256SUMS)"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected release archives, found $actual"
            cat SHA256SUMS
            exit 1
          fi
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xOzf "change-saga_${EXPECTED_VERSION}_linux_amd64.tar.gz" change-saga > "$smoke_dir/change-saga"
          chmod 0755 "$smoke_dir/change-saga"
          expected_date="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)"
          expected_version="$EXPECTED_VERSION (${EXPECTED_COMMIT:0:12}) built $expected_date"
          actual_version="$("$smoke_dir/change-saga" version)"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::release binary metadata mismatch: expected '$expected_version', got '$actual_version'"
            exit 1
          fi
          "$smoke_dir/change-saga" help >/dev/null
          cat SHA256SUMS
          {
            echo "### Release artifacts"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: write release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
          NOTARIZED: ${{ needs.build-macos.outputs.notarized }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/scripts/install.sh | sh -s -- --version $TAG"
            echo '```'
            echo
            echo "The installer detects macOS or Linux and the native architecture, verifies the archive against \`SHA256SUMS\`, and installs into \`~/.local/bin\` by default."
            echo
            echo "Windows PowerShell:"
            echo
            echo '```powershell'
            echo "\$env:CHANGE_SAGA_VERSION='$TAG'; irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/scripts/install.ps1 | iex"
            echo '```'
            echo
            echo "## Verify manually"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify change-saga_${VERSION}_linux_amd64.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "## macOS"
            echo
            if [ "$NOTARIZED" = "true" ]; then
              echo "The macOS binaries are signed with a Developer ID Application certificate and notarized by Apple."
            elif [ "$SIGNED" = "true" ]; then
              echo "> [!NOTE]"
              echo "> The macOS binaries are signed with a Developer ID Application certificate but are **not notarized** by Apple. Browser downloads remain subject to Gatekeeper; use the checksum-verifying installer above or build from source rather than disabling Gatekeeper."
            else
              echo "> [!NOTE]"
              echo "> The macOS binaries in this release are **not** signed with a Developer ID certificate. They run when installed with the installer above, because a curl download carries no quarantine attribute. If you download the archive with a browser, macOS will quarantine it and Gatekeeper will block it; build from source instead of disabling Gatekeeper."
            fi
            echo
            echo "## Changes"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: stage the verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ needs.meta.outputs.tag }}
          path: |
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS
            dist/change-saga_*.tar.gz
            dist/change-saga_*.zip
          if-no-files-found: error

      - name: rehearsal summary
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice::Artifacts built and verified. Push the tag to publish from a separate, tag-bound run."

  publish:
    name: attest and publish
    if: github.event_name == 'push'
    needs: [meta, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ needs.meta.outputs.tag }}
          path: dist

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/change-saga_*.tar.gz
            dist/change-saga_*.zip

      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.meta.outputs.commit }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          actual_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::$TAG moved from $EXPECTED_COMMIT to $actual_commit during the workflow; refusing to publish"
            exit 1
          fi
          flags=(--title "$TAG" --notes-file dist/RELEASE_NOTES.md --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            # Never let GitHub's automatic latest selection promote a prerelease.
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; delete it first or tag a new version"
            exit 1
          fi
          gh release create "$TAG" "${flags[@]}" \
            dist/SHA256SUMS \
            dist/change-saga_*.tar.gz \
            dist/change-saga_*.zip
