# Unsigned continuous integration.
#
# This workflow runs on every pull request, including pull requests from forks.
# It therefore never touches a secret and never signs anything: `permissions`
# is read-only, no `environment:` is referenced, and there is no
# `pull_request_target` trigger that would run fork code with write access to
# this repository's secrets. All signing lives in release.yml, which only runs
# for tags pushed to this repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify when called by the release workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail rather than silently downloading a toolchain that go.mod did not ask for.
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # The race detector needs a C toolchain, which is present on the
            # Linux and macOS images but not reliably on the Windows image.
            race: "-race"
          - os: macos-latest
            race: "-race"
          - os: windows-latest
            race: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ matrix.race }} ./...
      - name: release reproducibility
        if: runner.os != 'Windows'
        run: ./scripts/build_release_test.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -w:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: shellcheck release and installer scripts
        run: shellcheck scripts/*.sh
      - name: test macOS release credential policy
        run: ./scripts/macos-release-credentials_test.sh
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: lint workflows and enforce action pinning
        run: ./scripts/check-workflows.sh "$RUNNER_TEMP/actionlint"

      - name: release artifact script tests
        run: ./scripts/release_artifact_test.sh

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: install.sh end-to-end
        run: ./scripts/install_test.sh

  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: install.ps1 end-to-end
        shell: pwsh
        run: ./scripts/install_windows_test.ps1

  artifacts:
    name: artifact contents (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # Runs on both images because tar and zip listings differ between GNU and
      # BSD userland, and the release builds macOS artifacts on a macOS runner.
      - name: archive contents and permissions
        run: ./scripts/artifact_test.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      # Same script the release uses, so a packaging break shows up on the pull
      # request rather than on the tag. These artifacts are unsigned by
      # construction: no secret is available to this workflow.
      - name: build artifact
        run: ./scripts/build-release.sh 0.0.0-ci.${{ github.run_number }} ${{ matrix.goos }} ${{ matrix.goarch }} dist
      - name: smoke test the built binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          tar -xzf dist/change-saga_0.0.0-ci.${{ github.run_number }}_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/change-saga" version
          "$RUNNER_TEMP/change-saga" help > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-change-saga-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
